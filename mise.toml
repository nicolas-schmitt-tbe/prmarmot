# Read Rust's version, rustfmt and clippy from rust-toolchain.toml.
[settings]
idiomatic_version_file_enable_tools = ["rust"]

[tools]
gh = "latest"

# Native dependencies still come from the OS: Apple Command Line Tools on
# macOS; pkg-config, Clang and the GPUI graphics libraries on Linux.
[tasks.run]
description = "Run the desktop app (runtime Metal shaders on macOS)"
run = """
if [ "$(uname -s)" = Darwin ]; then
  cargo run --locked -p prmarmot --features gpui_platform/runtime_shaders -- "$@"
else
  cargo run --locked -p prmarmot -- "$@"
fi
"""

[tasks.install]
description = "Build and install the local macOS app and CLI (quit PR Marmot first)"
run = """
set -eu
if [ "$(uname -s)" != Darwin ]; then
  echo "The app bundle installer requires macOS." >&2
  exit 1
fi
cargo build --release --locked -p prmarmot -p prmarmot-cli --features gpui_platform/runtime_shaders
./scripts/bundle-app.sh
"""
